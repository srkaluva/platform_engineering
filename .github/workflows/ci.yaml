name: Platform Engineering CI

on:
  push:
    branches:
      - feature-baseline

  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

    #  - name: Validate YAML Files
    #    uses: ibiqlik/action-yamllint@v3

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint Platform Demo
        run: |
          helm lint helm/platform-demo

  build-and-push:

    needs: validate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend Image
        run: |
          docker build \
            -t frontend:${{ github.sha }} \
            applications/platform-demo/frontend

      - name: Tag Frontend Image
        run: |
          docker tag frontend:${{ github.sha }} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/platform-demo/frontend:${{ github.sha }}

      - name: Push Frontend Image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/platform-demo/frontend:${{ github.sha }}

      - name: Build Payment Image
        run: |
          docker build \
            -t payment:${{ github.sha }} \
            applications/platform-demo/payment

      - name: Tag Payment Image
        run: |
          docker tag payment:${{ github.sha }} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/platform-demo/payment:${{ github.sha }}

      - name: Push Payment Image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/platform-demo/payment:${{ github.sha }}
      - name: Update Helm Values

        run: |

          sed -i \
            "s/tag:.*/tag: ${GITHUB_SHA}/" \
            helm/platform-demo/values.yaml

      - name: Commit Changes

        run: |

          git config user.name "github-actions"

          git config user.email \
          "github-actions@github.com"

          git add helm/platform-demo/values.yaml

          git commit \
          -m "Update image tag ${GITHUB_SHA}"

          git push
